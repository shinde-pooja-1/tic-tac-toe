<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Toc Toe</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header><h1>TIC TOC TOE</h1></header>
    <main>
      <div class="button">
        <button class="btn new dark"></button>
        <div>
          <p>You : O</p>
          <p>Opponent : X</p>
        </div>
        <button class="new-game new btn">reset</button>
      </div>
      <div class="boxes">
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
      </div>
      <div class="con">
        <button class="cancle">X</button>
        <p class="win">you won</p>
        <button class="new-game new">new game</button>
      </div>
    </main>

    <script defer src="script.js"></script>
  </body>
</html>
